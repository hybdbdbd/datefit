<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="데이트핏 — 진주·김해 데이트 코스 추천 데모">
<title>데이트핏</title>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appkey=6IrZ44VkAs1xBjnALhOu84RwcdxQQY5G2N1Ynlqw"></script>
</head><body>
<title>데이트핏</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 폰 한 화면 폭(최대 430px) 한 줄. 크림 바탕 위에 흰 카드, 파스텔 스티커, 검정 알약 메뉴. 한 가지 밝은 테마로 고정. */
:root{
  --bg:#FBF6F0; --page:#EFE6DB; --card:#FFFFFF; --ink:#221E1C; --sub:#6B625C; --line:#EADFD2; --mute:#B8ACA0;
  --peach:#FFC9B5; --lilac:#E7DEFF; --mint:#D9F0E3; --butter:#FFE9A8; --pink:#FAD4DF;
  --link:#C2410C; --ok:#1E7A4D; --warnbg:#FFF1D6; --warnink:#7A4B00; --badbg:#FFE1DC; --badink:#A32A14;
  --display:'Bagel Fat One','Noto Sans KR',sans-serif; --body:'Noto Sans KR',system-ui,-apple-system,sans-serif; --hand:'Gaegu','Noto Sans KR',sans-serif;
  --shadow:0 4px 18px rgba(34,30,28,.07); --gut-l:max(20px,env(safe-area-inset-left,0px)); --gut-r:max(20px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
a{color:var(--link)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px;border-radius:8px}
.app{position:relative;max-width:430px;min-height:100%;margin:0 auto;background:var(--bg);padding-bottom:calc(104px + env(safe-area-inset-bottom,0px));box-shadow:0 0 60px rgba(34,30,28,.08)}
.app.nonav{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.pad{padding-left:var(--gut-l);padding-right:var(--gut-r)}
.display{font-family:var(--display);font-weight:400;letter-spacing:-.2px}
.sub{color:var(--sub)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* 상단 */
.top{display:flex;align-items:center;justify-content:space-between;padding-top:18px;gap:8px}
.wordmark{font-family:var(--display);font-size:22px}
.iconbtn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:var(--card);box-shadow:0 2px 10px rgba(34,30,28,.06)}
.seg{display:inline-flex;padding:4px;border-radius:24px;background:var(--card);box-shadow:0 2px 10px rgba(34,30,28,.06)}
.seg button{height:38px;padding:0 16px;border-radius:19px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}

/* 버튼·칩 */
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;padding:0 20px;border-radius:29px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:700;text-decoration:none;transition:transform .12s}
.cta:active,.card:active,.typecard:active{transform:scale(.98)}
.cta.ghost{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.cta.soft{background:var(--peach);color:var(--ink)}
.cta[disabled]{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 15px;border-radius:21px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none;font-weight:700}
.chip.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scrollx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scrollx::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:10px;font-size:11.5px;font-weight:700;background:var(--lilac);white-space:nowrap}
.tag.plain{background:#F3ECE4;font-weight:500;color:#4A433E}
.tag.ok{background:var(--mint)}
.tag.warn{background:var(--warnbg);color:var(--warnink)}
.tag.bad{background:var(--badbg);color:var(--badink)}

/* 홈 */
.hero h1{font-size:34px;line-height:1.22;margin-top:18px}
.hero p{margin-top:8px;font-size:14px}
.sect{margin-top:28px}
.sect h2{font-size:16px;font-weight:700}
.types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.typecard{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:68px;padding:0 16px;border-radius:22px;text-align:left;font-size:15px;font-weight:700;transition:transform .12s}
.typecard small{display:block;font-size:12px;font-weight:500;color:#4A433E}
.typecard:nth-child(odd){transform:rotate(-1deg)}
.typecard:nth-child(even){transform:rotate(.8deg)}
.typecard:last-child:nth-child(odd){grid-column:1/-1;transform:rotate(-.4deg)}
.next{display:flex;align-items:center;gap:12px;margin-top:16px;padding:14px 16px;border-radius:22px;background:var(--ink);color:var(--bg);width:100%;text-align:left}
.next small{color:var(--peach);font-weight:700;font-size:12px}
.note{margin-top:22px;font-size:12px;color:var(--sub);line-height:1.6}
.note button{color:var(--link);text-decoration:underline;font-size:12px}

/* 코스 카드 */
.card{display:block;width:100%;text-align:left;border-radius:26px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;transition:transform .12s}
.collage{display:flex;align-items:center;justify-content:center;height:132px;position:relative}
.collage.sm{height:auto;flex:0 0 92px;align-self:stretch;min-height:104px;border-radius:20px}
.tile{display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:20px;background:var(--card);box-shadow:0 4px 12px rgba(34,30,28,.12);margin:0 -5px}
.tile:nth-child(odd){transform:rotate(-7deg) translateY(4px)}
.tile:nth-child(even){transform:rotate(6deg) translateY(-5px)}
.collage.sm .tile{width:44px;height:44px;border-radius:14px;margin:-6px 0}
.collage.sm{flex-direction:column}
.rank{position:absolute;left:14px;top:12px;font-family:var(--display);font-size:13px;padding:5px 11px;border-radius:14px;background:var(--ink);color:var(--bg)}
.cbody{padding:14px 16px 16px}
.ctitle{font-size:19px;font-weight:700;line-height:1.3;letter-spacing:-.4px;margin-top:8px}
.cstops{margin-top:6px;font-size:13px;color:var(--sub)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.card.mini{display:flex;gap:12px;padding:10px;border-radius:24px}
.card.mini .cbody{padding:4px 4px 4px 0;flex:1;min-width:0}
.card.mini .ctitle{font-size:16px;margin-top:6px}
.list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.empty{margin-top:16px;padding:22px 18px;border-radius:24px;border:1.5px dashed var(--mute);text-align:center;color:var(--sub);font-size:14px}
details.out{margin-top:18px;border-radius:20px;background:#F3ECE4;padding:4px 14px}
details.out summary{min-height:44px;display:flex;align-items:center;font-size:13px;font-weight:700;cursor:pointer;list-style:none}
details.out summary::-webkit-details-marker{display:none}
details.out li{font-size:13px;color:#4A433E;padding:6px 0;border-top:1px solid var(--line)}
details.out ul{margin:0;padding:0 0 8px;list-style:none}

/* 조건 */
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q h2{font-size:15px;font-weight:700;margin-bottom:10px}
.q h2 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px}
.opt2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.optcard{min-height:64px;padding:10px 14px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;font-size:14px}
.optcard small{display:block;font-size:11.5px;color:var(--sub)}
.optcard[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none;font-weight:700}
.optcard[aria-pressed="true"] small{color:#D9D1CA;font-weight:400}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:52px;padding:8px 14px;border-radius:16px;background:var(--card);box-shadow:inset 0 0 0 1.5px var(--line);text-align:left;font-size:14px}
.optrow small{color:var(--sub);font-size:12px;margin-left:6px}
.optrow .dot{flex:0 0 20px;height:20px;border-radius:10px;box-shadow:inset 0 0 0 1.5px var(--mute)}
.optrow[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink);font-weight:700}
.optrow[aria-pressed="true"] .dot{background:var(--ink);box-shadow:inset 0 0 0 5px var(--card),0 0 0 1.5px var(--ink)}
.dim{opacity:.4;filter:saturate(.2);pointer-events:none}
.switch{position:relative;flex:0 0 52px;height:32px;border-radius:16px;background:#D9D1CA;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;transition:transform .15s}
button[aria-pressed="true"]>.switch{background:var(--ink)}
button[aria-pressed="true"]>.switch::after{transform:translateX(20px)}
.dateinput{height:42px;padding:0 12px;border-radius:21px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:14px;color:var(--ink)}
.hint{margin-top:8px;font-size:12px;color:var(--sub)}

/* 하단 고정 */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;padding:10px var(--gut-r) calc(14px + env(safe-area-inset-bottom,0px)) var(--gut-l);background:linear-gradient(rgba(251,246,240,0),var(--bg) 26%);z-index:5;display:flex;gap:8px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(251,246,240,0),var(--bg) 30%);z-index:5}
.nav div{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;border-radius:30px;background:var(--ink)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:24px;text-decoration:none;color:#D9D1CA;font-size:11px}
.nav a[aria-current="page"]{background:var(--peach);color:var(--ink);font-weight:700}

/* 상세 */
.dhero{position:relative;height:190px;display:flex;align-items:center;justify-content:center;border-radius:0 0 34px 34px}
.dhero .tile{width:78px;height:78px;border-radius:24px}
.back{position:absolute;left:var(--gut-l);top:14px}
.dtitle{font-size:28px;line-height:1.25;margin-top:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.box{margin-top:14px;padding:12px 14px;border-radius:18px;font-size:13px;line-height:1.55}
.box.info{background:#F3ECE4;color:#4A433E}
.box.warn{background:var(--warnbg);color:var(--warnink)}
.box ul{margin:4px 0 0;padding-left:18px}
.tl{list-style:none;margin:18px 0 0;padding:0}
.stop{position:relative;padding-left:46px}
.stop::before{content:"";position:absolute;left:17px;top:0;bottom:0;border-left:2px dashed #D9CDBF}
.stop:first-child::before{top:26px}
.stop:last-child::before{bottom:auto;height:26px}
.stop:only-child::before{display:none}
.dotc{position:absolute;left:0;top:10px;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:18px;border:3px solid var(--bg)}
.shead{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:6px 0;text-align:left}
.shead b{display:block;font-size:16px}
.shead span.t{font-size:12px;color:var(--sub)}
.pm{flex:0 0 30px;height:30px;border-radius:15px;background:var(--card);box-shadow:0 2px 8px rgba(34,30,28,.08);display:flex;align-items:center;justify-content:center;font-size:17px}
.sbody{margin:2px 0 12px;padding:14px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);animation:pop .18s ease-out}
.sbody p{font-size:13.5px;line-height:1.6}
.kv{display:grid;grid-template-columns:52px minmax(0,1fr);gap:6px 10px;margin-top:10px;font-size:13px}
.kv dt{color:var(--sub)}
.kv dd{margin:0}
.maplink{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:8px;font-size:14px;font-weight:700}
.maplinks{display:flex;flex-wrap:wrap;gap:4px 16px}
button.maplink{color:var(--link)}
/* 지도 */
.mapcard{margin-top:18px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);overflow:hidden}
.mapslot{position:relative;height:250px;background:#EEE7DE}
.mapslot>#tmap{position:absolute;inset:0}
.mapmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:13px;color:var(--sub);z-index:2;pointer-events:none}
.stopnums{display:flex;gap:6px;overflow-x:auto;padding:12px 14px 0;scrollbar-width:none}
.stopnums::-webkit-scrollbar{display:none}
.stopnum{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;min-height:36px;padding:0 12px 0 4px;border-radius:18px;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line);font-size:13px;white-space:nowrap}
.stopnum .n{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:13px;border:2px solid var(--ink);font-weight:700;font-size:12px}
.dnum{position:absolute;top:-6px;left:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:var(--ink);color:var(--bg);font:700 11px/19px var(--body);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stop.flash>.shead{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%{background:var(--butter);box-shadow:0 0 0 6px var(--butter);border-radius:14px}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
.wheelbtn{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px 14px;border-radius:20px;background:var(--butter);text-align:left;min-height:60px}
.wheelbtn b{display:block;font-size:15px}.wheelbtn small{display:block;font-size:12px;color:#4A433E}
.wheelico{flex:0 0 34px;height:34px;border-radius:17px;border:2px solid var(--ink);background:conic-gradient(var(--peach) 0 25%,var(--lilac) 0 50%,var(--mint) 0 75%,var(--pink) 0)}
.wheelbox{position:relative;display:flex;justify-content:center;margin:16px 0 6px}
.wheel{width:240px;height:240px;will-change:transform}
.wheel svg{display:block}
.wptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);z-index:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.wres{margin-top:10px;padding:12px 14px;border-radius:18px;background:var(--card);box-shadow:inset 0 0 0 2px var(--ink);text-align:center}
.wres small{display:block;font-size:12px;color:var(--sub)}.wres b{display:block;font-size:16px;margin-top:2px}.wres span{display:block;font-size:12px;color:var(--sub)}
.wlist{list-style:none;padding:0!important;margin:12px 0 0!important;display:flex;flex-direction:column;gap:6px}
.wlist .optrow{min-height:52px}
.wlist .optrow small{display:block;margin:2px 0 0}
.wno{display:inline-flex;align-items:center;justify-content:center;flex:0 0 26px;height:26px;border-radius:13px;border:2px solid var(--ink);font-weight:700;font-size:12px}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 4px}
.mapinfo{padding:4px 14px 12px;font-size:12px;color:var(--sub);line-height:1.55}
.mapinfo b{color:var(--ink)}
.mk{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:700 13px var(--body);color:var(--ink);border:2.5px solid var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.mk.me{background:#2F6BFF;border-color:#fff;color:#fff;width:22px;height:22px;font-size:0}
.alts{margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.alts h4{margin:0 0 8px;font-size:12.5px;font-weight:700}
.leg{margin:0 0 6px;font-size:12.5px;color:#4A433E;display:flex;align-items:center;gap:6px}
.leg.q{padding:0;border:0;color:var(--sub)}
.photoph{display:flex;gap:6px;margin-bottom:12px}
.photoph div{flex:1;height:74px;border-radius:14px;display:flex;align-items:center;justify-content:center}

/* 스티커 */
.board{display:flex;flex-wrap:wrap;justify-content:center;gap:16px 10px;margin-top:18px;padding:24px 12px;border-radius:28px;background:var(--card);box-shadow:var(--shadow)}
.stk{display:flex;flex-direction:column;align-items:center;gap:6px;width:98px;font-size:12.5px;text-align:center}
.stk i{display:flex;align-items:center;justify-content:center;width:86px;height:86px;border:4px solid #fff;box-shadow:0 3px 10px rgba(34,30,28,.16)}
.stk:nth-child(odd) i{border-radius:43px}
.stk:nth-child(even) i{border-radius:28px}
.stk.on:nth-child(3n) i{transform:rotate(-6deg)}
.stk.on:nth-child(3n+1) i{transform:rotate(5deg)}
.stk.on:nth-child(3n+2) i{transform:rotate(-2deg)}
.stk.on{font-weight:700}
.stk.off i{background:transparent!important;border:2px dashed #CDBFB1;box-shadow:none;opacity:.9}
.stk.off{color:var(--sub)}
.reward{display:flex;align-items:center;gap:14px;margin-top:16px;padding:16px;border-radius:24px;background:var(--ink);color:var(--bg)}
.reward small{color:var(--peach);font-weight:700;font-size:12px}
.reward p{font-size:12px;color:#D9D1CA;margin-top:3px}
.reward .n{font-family:var(--display);font-size:28px;color:var(--peach);white-space:nowrap}

/* 기록 */
.plan{padding:14px 16px;border-radius:22px;background:var(--card);box-shadow:var(--shadow)}
.plan .ctitle{margin-top:4px;font-size:17px}
.polaroid{padding:12px 12px 16px;background:#fff;box-shadow:0 8px 24px rgba(34,30,28,.12);width:calc(100% - 28px)}
.polaroid:nth-child(odd){transform:rotate(-1.6deg);align-self:flex-start}
.polaroid:nth-child(even){transform:rotate(1.4deg);align-self:flex-end}
.pphoto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:190px;font-size:13px;color:#4A433E;overflow:hidden;position:relative}
.pphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.polaroid h3{font-family:var(--hand);font-size:23px;line-height:1.2;margin:12px 4px 0}
.polaroid .d{font-size:12px;color:var(--sub);margin:2px 4px 0}
.memo{display:block;width:calc(100% - 8px);margin:8px 4px 0;min-height:56px;padding:8px 10px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;font-family:var(--hand);font-size:19px;line-height:1.3;color:var(--ink);resize:vertical}
.memo::placeholder{color:#8A7F76}
.textbtn{min-height:44px;padding:0 10px;font-size:13px;color:var(--sub);text-decoration:underline}
.diary{display:flex;flex-direction:column;gap:22px;margin-top:18px}

/* 시트·토스트 */
.scrim{position:fixed;inset:0;background:rgba(34,30,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:430px;max-height:86%;overflow:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:22px var(--gut-r) calc(22px + env(safe-area-inset-bottom,0px)) var(--gut-l);animation:up .22s ease-out}
.sheet h2{font-family:var(--display);font-weight:400;font-size:24px}
.sheet p,.sheet li{font-size:14px;line-height:1.65;color:#4A433E}
.sheet ul{padding-left:18px;margin:10px 0 0}
.sheet textarea{width:100%;min-height:150px;margin-top:12px;padding:12px;border-radius:14px;border:1.5px solid var(--line);font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(112px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 40px);padding:12px 18px;border-radius:22px;background:var(--ink);color:var(--bg);font-size:14px;z-index:30;animation:pop .18s ease-out;text-align:center}
.party{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:18px 0 6px}
.party .stk i{animation:stick .45s cubic-bezier(.2,1.5,.4,1) both}
.party .stk:nth-child(2) i{animation-delay:.12s}.party .stk:nth-child(3) i{animation-delay:.24s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{animation-name:tpop}@keyframes tpop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes stick{from{transform:scale(1.8) rotate(-18deg);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const ic=(n,s=22,c='currentColor')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]||I.pin}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const wdOf=s=>(new Date(s+'T00:00:00').getDay()+6)%7;
const dlabel=s=>{const [y,m,d]=s.split('-');return `${+m}.${+d} ${WD[wdOf(s)]}`};
const hm=t=>{t=((t%1440)+1440)%1440;return `${pad(Math.floor(t/60))}:${pad(t%60)}`};
const mins=s=>{const [h,m]=s.split(':');return +h*60+ +m};
const dist=m=>m>=1000?`${(m/1000).toFixed(1)}km`:`${m}m`;
const walkOf=(a,b)=>D.walk[a+'|'+b]||D.walk[b+'|'+a]||null;
const picon=p=>p.sec==='놀거리'?(PLAYICON[p.play]||'game'):SEC[p.sec][1];

/* ---------- 추천 로직 ---------- */
function stay(p){if(p.sub==='영화관')return 150;if(p.play==='공방·체험')return 90;return {'맛집':80,'카페':60,'술집':90,'산책·관광':50,'놀거리':60}[p.sec]}
function hoursCheck(p,date,t,d){
  const h=p.h;if(!h)return null;
  const wd=wdOf(date);
  if(!h.d.includes(wd))return {lvl:'bad',msg:`${WD[wd]}요일 영업 정보가 없어요. 쉬는 날일 수 있어요`};
  if(!h.o)return null;
  let o=mins(h.o),c=mins(h.c);if(c<=o)c+=1440;
  if(t<o)return {lvl:'warn',msg:`${h.o}에 열어요. 도착 예상은 ${hm(t)}`};
  if(t>=c)return {lvl:'bad',msg:`${h.c==='24:00'?'자정':h.c}에 닫아요. 도착 예상은 ${hm(t)}`};
  if(h.br){const b0=mins(h.br[0]),b1=mins(h.br[1]);if(t>=b0&&t<b1)return {lvl:'warn',msg:`${h.br[0]}~${h.br[1]} 휴게시간이에요`}}
  if(t+d>c+20)return {lvl:'warn',msg:`${h.c==='24:00'?'자정':h.c} 마감이라 시간이 빠듯해요`};
  return null;
}
function parkOf(p){if(p.pk&&p.pk.startsWith('없음'))return 'no';if((p.pk&&p.pk.startsWith('있음'))||(!p.pk&&p.parking&&!/불가/.test(p.parking)))return 'yes';return 'unknown'}
function resolve(c,cond,picks,inner){
  picks=picks||{};
  const alc=cond.move==='car'?'none':cond.alc;
  const r={c,stops:[],out:null,near:null,reasons:[],warn:[],score:0,alc};
  if(c.car==='need'&&cond.move!=='car')r.out='차가 있어야 갈 수 있는 코스예요';
  if((c.barCore||c.type==='drink')&&alc==='none')r.out=r.out||(cond.move==='car'?'한잔 코스라 운전하는 날에는 빠져요':'한잔 코스라 술을 안 마시는 날에는 빠져요');
  c.stops.forEach((s,i)=>{
    const all=[s.id,...s.alts];
    const ok=all.filter(id=>{const p=PL[id];return !(cond.noRaw&&p.raw)&&!(p.sec==='술집'&&alc==='none')});
    if(!ok.length){if(s.core&&!r.out)r.out=PL[s.id].raw?'날것이 주메뉴인 곳이 중심이에요':'술집이 중심인 코스예요';return}
    let id=picks[i]&&ok.includes(picks[i])?picks[i]:null;
    if(!id){
      const pref=x=>{const p=PL[x];let v=x===s.id?1:0;if(p.play&&cond.play.includes(p.play))v+=2;if(p.bar&&p.bar===alc)v+=2;if(p.visited)v+=.4;const h=p.h;if(h&&!h.d.includes(wdOf(cond.date)))v-=3;return v};
      id=ok.slice().sort((a,b)=>pref(b)-pref(a))[0];
    }
    r.stops.push({id,p:PL[id],slot:i,opt:s.opt,alts:ok.filter(x=>x!==id)});
  });
  if(r.stops.length<2&&!r.out)r.out='조건에 맞는 장소가 부족해요';
  // 시간표
  let t=TIMES[cond.time][1];
  r.stops.forEach((st,i)=>{
    if(i>0){
      const prev=r.stops[i-1];const w=walkOf(prev.id,st.id);
      const car=cond.move==='car'||c.car==='need';
      if(w&&(!car||w[0]<=600)){st.leg={m:w[0],min:w[1]};t+=w[1]}
      else if(car){const q=rtOf(prev.id,st.id,'car');if(q){st.leg={car:true,tm:q.m,tmin:q.min};t+=q.min}else{st.leg={car:true};t+=15}}
      else{const q=rtOf(prev.id,st.id,'walk');if(q){st.leg={unknown:true,tm:q.m,tmin:q.min};t+=q.min}else{st.leg={unknown:true};t+=10}}
    }
    const hh=st.p.h;if(hh&&hh.o&&hh.d.includes(wdOf(cond.date))){const o=mins(hh.o);if(t<o&&o-t<=30)t=o}
    st.t=t;st.d=stay(st.p);st.hc=hoursCheck(st.p,cond.date,t,st.d);t+=st.d;
  });
  r.end=t;
  // 걷는 거리: 코스 안에서 잰 구간 중 가장 먼 두 곳
  let mx=0,unk=0;
  for(let a=0;a<r.stops.length;a++)for(let b=a+1;b<r.stops.length;b++){const w=walkOf(r.stops[a].id,r.stops[b].id);if(w)mx=Math.max(mx,w[0]);else unk++}
  r.maxWalk=mx;r.unmeasured=unk;
  // 점수와 이유
  const ps=r.stops.map(s=>s.p);
  if(cond.move==='walk'){
    if(mx){r.walkLabel=unk?`잰 구간 중 가장 먼 곳 ${dist(mx)}`:`가장 먼 구간 ${dist(mx)}`;r.reasons.push(['plain',`${ic('foot',13)}${r.walkLabel}`]);r.score+=mx<=500?2:mx<=1000?1:0}
    if(cond.limit&&mx>cond.limit&&!r.out)r.near=`걷는 거리가 ${dist(mx)}라 기준(${dist(cond.limit)})을 넘어요`;
  }else{
    const k=ps.filter(p=>parkOf(p)==='yes').length;
    r.reasons.push([k===ps.length?'ok':'plain',`주차 확인 ${k}/${ps.length}곳`]);r.score+=2*k/ps.length;if(c.type==='car')r.score+=2;
  }
  const hits=[...new Set(ps.map(p=>p.play).filter(x=>x&&cond.play.includes(x)))];
  hits.forEach(h=>{r.reasons.push(['ok',`${PLAYS.find(x=>x[0]===h)[1]} 포함`]);r.score+=3});
  if(cond.play.length&&!hits.length)r.score-=1;
  const bars=ps.filter(p=>p.sec==='술집');
  if(alc!=='none'){
    if(bars.length){r.score+=2;const m=bars.some(b=>b.bar===alc);if(m){r.score+=1.5;r.reasons.push(['ok',alc==='light'?'가볍게 한 잔 가능':'제대로 마시기 좋은 곳'])}}
    if(c.type==='drink')r.score+=1;
  }
  if(cond.first){
    if(c.type==='movie'||c.type==='mood'){r.score+=2;r.reasons.push(['ok','처음 만나는 날에 무난'])}
    if(ps.some(p=>p.play==='룸카페·프라이빗'))r.score-=2;
    if(bars.some(b=>b.bar==='heavy'))r.score-=1;
  }
  const v=ps.filter(p=>p.visited).length;
  if(v){r.reasons.push(['plain',`팀이 가본 곳 ${v}곳`]);r.score+=v*.3}
  r.visited=v;
  r.stops.forEach(s=>{if(s.hc){r.warn.push(`${s.p.name}: ${s.hc.msg}`);r.score-=s.hc.lvl==='bad'?4:2}if(s.p.wait)r.warn.push(`${s.p.name}: 웨이팅이 있을 수 있어요`)});
  r.issues=r.stops.filter(s=>s.hc).length;
  if(!inner&&r.issues&&!r.out){
    const cur=TIMES[cond.time][1];
    const alt=Object.keys(TIMES).filter(k=>k!==cond.time).map(k=>({k,n:resolve(c,Object.assign({},cond,{time:k}),picks,true).issues})).filter(x=>x.n===0).sort((a,b)=>Math.abs(TIMES[a.k][1]-cur)-Math.abs(TIMES[b.k][1]-cur))[0];
    if(alt)r.better=alt.k;
  }
  return r;
}
function ranked(){
  const all=D.courses.filter(c=>c.city===S.city&&(S.type==='all'||c.type===S.type)).map(c=>resolve(c,S.cond));
  const by=(a,b)=>b.score-a.score;
  return {fit:all.filter(r=>!r.out&&!r.near).sort(by),near:all.filter(r=>!r.out&&r.near).sort(by),out:all.filter(r=>r.out)};
}
function condChips(){
  const c=S.cond,a=[dlabel(c.date),TIMES[c.time][0],c.move==='car'?'차로':('걸어서'+(c.limit?` ${dist(c.limit)} 안`:''))];
  if(c.move!=='car')a.push({none:'술 안 마셔요',light:'가볍게 한 잔',heavy:'제대로 한 잔'}[c.alc]);
  c.play.forEach(p=>a.push(PLAYS.find(x=>x[0]===p)[1]));
  if(c.first)a.push('처음 만나는 날');if(c.noRaw)a.push('날것 빼고');
  return a;
}

function collage(r,cls){
  const t=TYPES[r.c.type];
  return `<div class="collage ${cls||''}" style="background:${t.color}">${r.stops.slice(0,cls==='sm'?3:4).map(s=>`<span class="tile">${ic(picon(s.p),cls==='sm'?20:26)}</span>`).join('')}</div>`;
}
function courseCard(r,i,big){
  const t=TYPES[r.c.type];
  const names=r.stops.map(s=>esc(s.p.name)).join(' → ');
  const chips=r.reasons.slice(0,3).map(x=>`<span class="tag ${x[0]}">${x[1]}</span>`).join('')+(r.better?`<span class="tag warn">${TIMES[r.better][0]}에 가면 시간이 맞아요</span>`:r.warn.length?`<span class="tag warn">확인할 점 ${r.warn.length}</span>`:'');
  if(big)return `<button class="card" data-go="c-${r.c.id}"><div style="position:relative">${collage(r)}<span class="rank">가장 잘 맞아요</span></div><div class="cbody"><span class="tag" style="background:${t.color}">${t.long} · ${esc(r.c.zone)}</span><p class="ctitle">${esc(r.c.title)}</p><p class="cstops">${names}</p><div class="reasons">${chips}</div></div></button>`;
  return `<button class="card mini" data-go="c-${r.c.id}">${collage(r,'sm')}<div class="cbody"><span class="tag" style="background:${t.color}">${t.label} · ${esc(r.c.zone)}</span><p class="ctitle">${esc(r.c.title)}</p><p class="cstops">${names}</p><div class="reasons">${chips}</div></div></button>`;
}
function nav(cur){
  const it=[['home','홈','home'],['courses','코스','route'],['stickers','스티커','star'],['diary','기록','book']];
  return `<nav class="nav" aria-label="하단 메뉴"><div>${it.map(x=>`<a href="#${x[0]}" ${cur===x[0]?'aria-current="page"':''}>${ic(x[2],20)}${x[1]}</a>`).join('')}</div></nav>`;
}

/* ---------- 지도 (TMAP) : 공개 사이트 빌드에서만 켜짐 ---------- */
const MAP=typeof window.Tmapv2!=='undefined';
const MAPTIP='번호는 추천 순서예요. 순서는 바꿔서 가도 돼요. 번호를 누르면 그 장소 설명으로 이동해요. 선은 TMAP 길찾기 경로예요.';
const TK='6IrZ44VkAs1xBjnALhOu84RwcdxQQY5G2N1Ynlqw';
const TAPI='https://apis.openapi.sk.com/tmap/';
const GEOK='datefit-geo-v1',TTL=23*3600e3; // TMAP 약관: 받은 데이터는 24시간 넘게 쓰지 않음
const RT={}; // 경로는 메모리에만
const MV={el:null,map:null,key:null,ov:[],me:null,meMk:null,meLine:null,stat:'',info:'',busy:false,pts:{}};
function geoAll(){let c={};try{c=JSON.parse(localStorage.getItem(GEOK))||{}}catch(e){}const n=Date.now();for(const k in c)if(!(n-c[k][2]<TTL))delete c[k];return c}
function geoPut(id,v){const c=geoAll();c[id]=v;try{localStorage.setItem(GEOK,JSON.stringify(c))}catch(e){}}
function rtOf(a,b,mode){return RT[a+'|'+b+'|'+mode]||null}
async function tget(path,params){
  const u=TAPI+path+(path.includes('?')?'&':'?')+new URLSearchParams(params);
  const r=await fetch(u,{headers:{appKey:TK}});
  if(r.status===204)return null;
  if(!r.ok)throw new Error('TMAP '+r.status);
  return r.json();
}
async function tpost(path,body){
  const r=await fetch(TAPI+path,{method:'POST',headers:{appKey:TK,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('TMAP '+r.status);
  return r.json();
}
function addrKey(a){const t=String(a||'').replace(/\(.*?\)/g,' ').trim().split(/\s+/);const i=t.findIndex((x,j)=>j>1&&/^\d+(-\d+)?$/.test(x));return i>0?{q:t.slice(0,i+1).join(' '),k:t[i-1]+' '+t[i]}:{q:t.join(' '),k:''}}
async function locate(id){
  const hit=geoAll()[id];if(hit)return hit;
  const p=PL[id],city=/김해/.test(p.addr)?'김해':'진주',A=addrKey(p.addr);
  let v=null;
  try{
    const j=await tget('pois',{version:1,format:'json',count:10,reqCoordType:'WGS84GEO',resCoordType:'WGS84GEO',searchKeyword:city+' '+p.name.replace(/[()]/g,' ').replace(/\s+/g,' ').trim()});
    const L=(j&&j.searchPoiInfo&&j.searchPoiInfo.pois.poi)||[];
    const m=L.find(x=>A.k&&`${x.roadName} ${x.firstBuildNo}${x.secondBuildNo&&x.secondBuildNo!=='0'?'-'+x.secondBuildNo:''}`===A.k);
    if(m)v=[+(m.frontLat||m.noorLat),+(m.frontLon||m.noorLon),Date.now(),'poi'];
  }catch(e){}
  if(!v){
    const j=await tget('geo/fullAddrGeo',{version:1,format:'json',coordType:'WGS84GEO',fullAddr:A.q});
    const c=j&&j.coordinateInfo&&j.coordinateInfo.coordinate&&j.coordinateInfo.coordinate[0];
    if(c){const la=c.newLatEntr||c.newLat||c.latEntr||c.lat,lo=c.newLonEntr||c.newLon||c.lonEntr||c.lon;if(la&&lo)v=[+la,+lo,Date.now(),'addr']}
  }
  if(v)geoPut(id,v);
  return v;
}
async function routeOf(a,b,pa,pb,mode){
  const k=a+'|'+b+'|'+mode;if(RT[k])return RT[k];
  const body={startX:String(pa[1]),startY:String(pa[0]),endX:String(pb[1]),endY:String(pb[0]),reqCoordType:'WGS84GEO',resCoordType:'WGS84GEO',startName:'출발',endName:'도착'};
  const j=await tpost(mode==='car'?'routes?version=1&format=json':'routes/pedestrian?version=1&format=json',mode==='car'?Object.assign(body,{searchOption:'0'}):body);
  const F=j.features||[];const pr=(F[0]&&F[0].properties)||{};
  const path=[];F.forEach(f=>{if(f.geometry.type==='LineString')f.geometry.coordinates.forEach(c=>path.push([c[1],c[0]]))});
  const v={m:pr.totalDistance,min:Math.max(1,Math.round(pr.totalTime/60)),path};
  if(a&&b)RT[k]=v;return v;
}
const LL=(p)=>new Tmapv2.LatLng(p[0],p[1]);
function hav(a,b){const R=6371e3,r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(h)))}
function mapCard(id,r,car){
  return `<section class="mapcard" aria-label="코스 지도"><div class="mapslot" id="mapslot">${MV.stat?`<div class="mapmsg" id="mapmsg">${esc(MV.stat)}</div>`:''}</div>
  <div class="stopnums" role="group" aria-label="장소로 이동">${r.stops.map((s,i)=>`<button class="stopnum" data-act="stop" data-i="${i}"><span class="n" style="background:${SEC[s.p.sec][0]}">${i+1}</span>${esc(s.p.name)}</button>`).join('')}</div>
  <div class="mapbar"><button class="chip sm" data-act="me">${ic('pin',16)}내 위치</button><button class="chip sm" data-act="fit">코스 전체 보기</button></div>
  <p class="mapinfo" id="mapinfo">${MV.info||MAPTIP}</p></section>`;
}
function setStat(t){MV.stat=t;const s=document.getElementById('mapslot');if(!s)return;let m=document.getElementById('mapmsg');if(!t){m&&m.remove();return}if(!m){m=document.createElement('div');m.className='mapmsg';m.id='mapmsg';s.appendChild(m)}m.textContent=t}
function setInfo(h){MV.info=h;const e=document.getElementById('mapinfo');if(e)e.innerHTML=h}
function clearOv(){MV.ov.forEach(o=>{try{o.setMap(null)}catch(e){}});MV.ov=[]}
function mapFit(){if(!MV.map)return;const B=new Tmapv2.LatLngBounds();let n=0;Object.values(MV.pts).forEach(p=>{if(p){B.extend(LL(p));n++}});if(MV.me){B.extend(LL(MV.me));n++}if(n===1){MV.map.setCenter(LL(Object.values(MV.pts).find(Boolean)||MV.me));MV.map.setZoom(16)}else if(n)MV.map.fitBounds(B)}
function mapMount(h){
  if(!h.startsWith('c-'))return;
  const slot=document.getElementById('mapslot');if(!slot)return;
  const id=h.slice(2),c=D.courses.find(x=>x.id===id);if(!c)return;
  if(!MV.el){MV.el=document.createElement('div');MV.el.id='tmap';slot.appendChild(MV.el);
    try{MV.map=new Tmapv2.Map('tmap',{center:new Tmapv2.LatLng(35.19,128.08),width:'100%',height:'250px',zoom:15,zoomControl:false,scrollwheel:false})}catch(e){setStat('지도를 불러오지 못했어요.');return}}
  else slot.insertBefore(MV.el,slot.firstChild);
  try{MV.map.resize(slot.clientWidth,250)}catch(e){}
  const r=resolve(c,S.cond,S.picks[id]);
  const key=id+':'+r.stops.map(s=>s.id).join(',');
  if(key===MV.key)return;
  MV.key=key;drawCourse(r,key);
}
async function drawCourse(r,key){
  clearOv();MV.pts={};MV.me=null;if(MV.meMk){MV.meMk.setMap(null);MV.meMk=null}if(MV.meLine){MV.meLine.setMap(null);MV.meLine=null}
  setInfo(MAPTIP);
  setStat('지도에 코스를 그리는 중이에요…');
  let pts;
  try{pts=await Promise.all(r.stops.map(s=>locate(s.id).catch(()=>null)))}catch(e){pts=[]}
  if(MV.key!==key)return;
  r.stops.forEach((s,i)=>{MV.pts[s.id]=pts[i]&&[pts[i][0],pts[i][1]]});
  const miss=r.stops.filter((s,i)=>!pts[i]).map(s=>s.p.name);
  r.stops.forEach((s,i)=>{if(!pts[i])return;
    const mk=new Tmapv2.Marker({position:LL(pts[i]),iconHTML:`<div class="mk" style="background:${SEC[s.p.sec][0]}">${i+1}</div>`,iconSize:new Tmapv2.Size(28,28),offset:new Tmapv2.Point(14,14),title:s.p.name,map:MV.map});
    ['click','touchend'].forEach(ev=>{try{mk.addListener(ev,()=>goStop(i))}catch(e){}});
    MV.ov.push(mk)});
  if(!pts.some(Boolean)){setStat('장소 위치를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.');return}
  setStat('');mapFit();
  let changed=false,fail=0;
  await Promise.all(r.stops.slice(1).map(async(s,j)=>{
    const a=r.stops[j],pa=pts[j],pb=pts[j+1];if(!pa||!pb)return;
    const mode=s.leg&&s.leg.car?'car':'walk';
    const had=!!rtOf(a.id,s.id,mode);
    try{const v=await routeOf(a.id,s.id,pa,pb,mode);if(MV.key!==key)return;
      if(v.path.length)MV.ov.push(new Tmapv2.Polyline({path:v.path.map(LL),strokeColor:mode==='car'?'#6B625C':'#221E1C',strokeWeight:5,strokeOpacity:.85,map:MV.map}));
      if(!had)changed=true}catch(e){fail++}
  }));
  if(MV.key!==key)return;
  const notes=[];if(miss.length)notes.push(`${miss.join(', ')} 위치는 아직 못 찾았어요.`);if(fail)notes.push('일부 구간 경로를 받아오지 못했어요.');
  setInfo(MAPTIP+(notes.length?' '+esc(notes.join(' ')):''));
  if(changed)render(true);
}
let goT=0;
function goStop(i){
  const now=Date.now();if(now-goT<500)return;goT=now;
  S.open=i;render(true);
  const id=route().slice(2),c=D.courses.find(x=>x.id===id);
  if(MV.map&&c){const r=resolve(c,S.cond,S.picks[id]),pt=r.stops[i]&&MV.pts[r.stops[i].id];if(pt){try{MV.map.setCenter(LL(pt))}catch(e){}}}
  requestAnimationFrame(()=>{const el=document.getElementById('stop-'+i);if(!el)return;
    const smooth=!matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-12,behavior:smooth?'smooth':'auto'});
    el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash');
    const h=el.querySelector('.shead');h&&h.focus({preventScroll:true});});
}
function findMe(){
  if(!MV.map)return;
  if(!window.isSecureContext||!navigator.geolocation){toast('이 주소에서는 위치를 쓸 수 없어요');return}
  setInfo('현재 위치를 찾는 중이에요…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const me=[pos.coords.latitude,pos.coords.longitude];MV.me=me;
    if(MV.meMk)MV.meMk.setMap(null);if(MV.meLine){MV.meLine.setMap(null);MV.meLine=null}
    MV.meMk=new Tmapv2.Marker({position:LL(me),iconHTML:'<div class="mk me"></div>',iconSize:new Tmapv2.Size(22,22),offset:new Tmapv2.Point(11,11),title:'내 위치',map:MV.map});
    const id=route().slice(2),c=D.courses.find(x=>x.id===id);const r=resolve(c,S.cond,S.picks[id]);
    const f=r.stops[0],fp=MV.pts[f.id];
    if(!fp){setInfo('내 위치를 표시했어요. 첫 장소 위치를 아직 못 찾아서 길은 그리지 않았어요.');mapFit();return}
    const d=hav(me,fp);
    if(d>3000){setInfo(`첫 장소 <b>${esc(f.p.name)}</b>까지 직선으로 ${dist(d)}예요. 걷기엔 멀어서 길은 그리지 않았어요. 네이버지도 앱으로 대중교통 길찾기를 열 수 있어요.`);mapFit();return}
    try{const v=await routeOf(null,null,me,fp,'walk');
      MV.meLine=new Tmapv2.Polyline({path:v.path.map(LL),strokeColor:'#2F6BFF',strokeWeight:5,strokeOpacity:.9,map:MV.map});
      setInfo(`내 위치에서 첫 장소 <b>${esc(f.p.name)}</b>까지 걸어서 약 ${v.min}분 · ${dist(v.m)} (TMAP 경로)`);}
    catch(e){setInfo('내 위치를 표시했어요. 길은 받아오지 못했어요.')}
    mapFit();
  },err=>{setInfo(err.code===1?'위치 권한이 꺼져 있어요. 브라우저 설정에서 위치를 허용해 주세요.':'현재 위치를 찾지 못했어요. 잠시 뒤 다시 해 보세요.')},{enableHighAccuracy:true,timeout:12000,maximumAge:60000});
}
function openNaver(i){
  const id=route().slice(2),c=D.courses.find(x=>x.id===id);const r=resolve(c,S.cond,S.picks[id]);
  const s=r.stops[i],to=MV.pts[s.id];
  if(!to){toast('장소 위치를 불러오는 중이에요. 잠시 뒤 다시 눌러 주세요');return}
  let from=null,fname='';
  if(i>0){from=MV.pts[r.stops[i-1].id];fname=r.stops[i-1].p.name}else if(MV.me){from=MV.me;fname='내 위치'}
  const mode=i===0?(MV.me&&hav(MV.me,to)<=3000?'walk':'public'):(s.leg&&s.leg.car?'car':'walk');
  const q=new URLSearchParams();
  if(from){q.set('slat',from[0]);q.set('slng',from[1]);q.set('sname',fname)}
  q.set('dlat',to[0]);q.set('dlng',to[1]);q.set('dname',s.p.name);q.set('appname',location.origin+location.pathname);
  const path='route/'+mode+'?'+q.toString();
  if(/Android/i.test(navigator.userAgent))location.href='intent://'+path+'#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end';
  else{location.href='nmap://'+path;if(!/iPhone|iPad|iPod/i.test(navigator.userAgent))setTimeout(()=>toast('네이버지도 앱이 있는 휴대폰에서 열려요'),400)}
}

function stickerList(city){
  const cs=D.courses.filter(c=>c.city===city);
  const done=S.diary.filter(e=>e.status==='done'&&e.city===city);
  const types=Object.entries(TYPES).filter(([k])=>cs.some(c=>c.type===k)).map(([k,t])=>({key:'t-'+k,name:t.long,icon:t.icon,color:t.color,on:done.some(e=>e.type===k),how:`'${t.long}' 코스를 다녀오면 붙어요`}));
  const lms=[...new Set(cs.flatMap(c=>c.stops.flatMap(s=>[s.id,...s.alts])).filter(id=>PL[id].lm))].map(id=>({key:'p-'+id,name:PL[id].name.replace(/ \(.*\)/,''),icon:picon(PL[id]),color:SEC[PL[id].sec][0],on:done.some(e=>e.stops.includes(id)),how:`${PL[id].name}이(가) 들어간 코스를 다녀오면 붙어요`}));
  return [...types,...lms];
}

   <div style="margin-top:18px"><button class="cta" data-act="close">알겠어요</button></div>`;
  if(s.kind==='qr')inner=`<h2>방문 인증</h2><p style="margin-top:6px"><b>${esc(PL[s.id].name)}</b></p><ul><li>실제 서비스에서는 가게에 놓인 QR을 카메라로 찍어서 인증해요.</li><li>이 데모에는 QR이 없어서 아래 버튼으로 대신해요.</li><li>인증 기록은 가게에 보내는 리포트의 "방문 커플 수"로 집계할 계획이에요. 누가 왔는지는 가게에 알려주지 않아요.</li></ul><div class="row" style="margin-top:14px"><button class="cta ghost" data-act="close">닫기</button><button class="cta" data-act="qr-ok" data-id="${s.id}">인증한 걸로 하기</button></div>`;
  if(s.kind==='share')inner=`<h2>코스 공유</h2><p style="margin-top:6px">${s.copied?'복사했어요. 메신저에 붙여 넣으면 돼요.':'아래 내용을 길게 눌러 복사해 주세요.'}</p><textarea id="share-text" readonly>${esc(s.text)}</textarea><div style="margin-top:12px"><button class="cta" data-act="close">닫기</button></div>`;
  if(s.kind==='party')inner=`<h2>${s.list.length?'스티커가 붙었어요!':'기록에 담았어요'}</h2><p style="margin-top:6px">${esc(s.title)}</p>${s.list.length?`<div class="party">${s.list.map(x=>stkHTML(x)).join('')}</div>`:'<p style="margin-top:8px">이 코스로 받을 스티커는 이미 다 모았어요.</p>'}<div class="row" style="margin-top:14px"><button class="cta ghost" data-act="close" data-then="stickers">스티커북 보기</button><button class="cta" data-act="close">사진·메모 남기기</button></div>`;
  if(s.kind==='wheel')inner=wheelHTML(s);
  return `<div class="scrim" data-act="close-scrim"><div class="sheet" role="dialog" aria-modal="true">${inner}</div></div>`;
}
const WCOL=['#FFC9B5','#E7DEFF','#D9F0E3','#FFE9A8','#FAD4DF','#CDE7F7','#F7D9B8','#E2EFC5'];
function wheelHTML(w){
  const on=w.on,n=on.length,seg=360/Math.max(n,1),R=120,C=130;
  const pt=a=>{const t=(a-90)*Math.PI/180;return [(C+R*Math.cos(t)).toFixed(2),(C+R*Math.sin(t)).toFixed(2)]};
  const slices=n<2?`<circle cx="${C}" cy="${C}" r="${R}" style="fill:#F3ECE4"/>`:on.map((id,k)=>{
    const a0=k*seg,a1=(k+1)*seg,[x0,y0]=pt(a0),[x1,y1]=pt(a1),mid=(a0+a1)/2,t=(mid-90)*Math.PI/180;
    const lx=(C+R*.66*Math.cos(t)).toFixed(1),ly=(C+R*.66*Math.sin(t)).toFixed(1);
    const no=w.ids.indexOf(id)+1;
    return `<path d="M${C} ${C}L${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}Z" style="fill:${WCOL[(no-1)%WCOL.length]}" stroke="#221E1C" stroke-width="2"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" style="font:700 22px var(--body);fill:#221E1C">${no}</text>`}).join('');
  const res=w.res&&D.courses.find(c=>c.id===w.res);
  return `<h2>돌림판으로 정하기</h2>
  <p style="margin-top:6px">${w.spin?'돌아가는 중이에요…':'돌림판에 넣을 코스를 골라 주세요. 두 개 이상이면 돌릴 수 있어요.'}</p>
  <div class="wheelbox"><div class="wptr" aria-hidden="true"></div><div id="wheel" class="wheel" style="transform:rotate(${w.rot}deg)"><svg viewBox="0 0 260 260" width="240" height="240" role="img" aria-label="돌림판, 코스 ${n}개">${slices}<circle cx="${C}" cy="${C}" r="${R}" fill="none" stroke="#221E1C" stroke-width="3"/><circle cx="${C}" cy="${C}" r="14" style="fill:#221E1C"/></svg></div></div>
  <div role="status" aria-live="polite">${res?`<div class="wres"><small>오늘은 이 코스예요</small><b>${w.ids.indexOf(res.id)+1}. ${esc(res.title)}</b><span>${esc(res.zone)}</span></div>`:''}</div>
  <ul class="wlist">${w.ids.map((id,k)=>{const c=D.courses.find(x=>x.id===id);const sel=on.includes(id);return `<li><button class="optrow" data-act="wtog" data-v="${id}" aria-pressed="${sel}" ${w.spin?'disabled':''}><span class="wno" style="background:${WCOL[k%WCOL.length]}">${k+1}</span><span class="grow">${esc(c.title)}<small>${esc(TYPES[c.type].label)} · ${esc(c.zone)}</small></span><span class="dot"></span></button></li>`}).join('')}</ul>
  <div class="row" style="margin-top:14px;position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)">${res?`<button class="cta ghost" data-act="wspin" ${n<2?'disabled':''}>다시 돌리기</button><button class="cta" data-act="wgo" data-v="${res.id}">이 코스 보기</button>`:`<button class="cta ghost" style="flex:0 0 96px" data-act="close" ${w.spin?'disabled':''}>닫기</button><button class="cta" data-act="wspin" ${n<2||w.spin?'disabled':''}>${n<2?'두 개 이상 골라 주세요':'돌리기'}</button>`}</div>`;
}
function spinWheel(){
  const w=S.sheet;if(!w||w.kind!=='wheel'||w.spin||w.on.length<2)return;
  const rnd=()=>{try{return crypto.getRandomValues(new Uint32Array(1))[0]/4294967296}catch(e){return Math.random()}};
  const n=w.on.length,seg=360/n,k=Math.floor(rnd()*n),a=k*seg+seg*(0.15+0.7*rnd());
  const cur=((w.rot%360)+360)%360,target=((360-a)%360+360)%360;
  const rot=w.rot+360*5+((target-cur)+360)%360;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  w.spin=true;w.res=null;paintLayer();
  const el=document.getElementById('wheel');
  if(el&&!reduce){void el.offsetWidth;el.style.transition='transform 4.2s cubic-bezier(.12,.7,.1,1)';el.style.transform=`rotate(${rot}deg)`}
  w.rot=rot;
  setTimeout(()=>{if(S.sheet!==w)return;w.spin=false;w.res=w.on[k];paintLayer()},reduce?300:4300);
}
let toastT;
function toast(m){clearTimeout(toastT);S.toast=m;paintLayer();toastT=setTimeout(()=>{S.toast=null;paintLayer()},2400)}
function paintLayer(){document.getElementById('layer').innerHTML=sheetHTML()+(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'')}

/* ---------- 라우팅 ---------- */
function route(){const h=(location.hash||'#home').slice(1);return h||'home'}
let lastRoute='';
function render(keep){
  const h=route(),app=document.getElementById('app');
  const y=window.scrollY;
  let html;
  if(h.startsWith('c-'))html=vDetail(h.slice(2));
  else html=({home:vHome,plan:vPlan,courses:vCourses,stickers:vStickers,diary:vDiary,owner:vOwner}[h]||vHome)();
  app.className='app'+((h==='plan'||h==='owner'||h.startsWith('c-'))?' nonav':'');
  app.innerHTML=html;
  if(keep&&h===lastRoute)window.scrollTo(0,y);else window.scrollTo(0,0);
  lastRoute=h;paintLayer();
  if(MAP)mapMount(h);
}
window.addEventListener('hashchange',()=>{S.open=0;S.confirm=null;render()});

document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){location.hash=go.dataset.go;return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,v=b.dataset.v,c=S.cond;
  if(a==='close-scrim'){if(e.target!==b||(S.sheet&&S.sheet.spin))return;S.sheet=null;paintLayer();return}
  if(a==='close'){S.sheet=null;paintLayer();if(b.dataset.then)location.hash=b.dataset.then;return}
  if(a==='city'){S.city=v;save();render(true);return}
  if(a==='info'){S.sheet={kind:'info'};paintLayer();return}
  if(a==='type'){S.type=v;if(route()!=='courses')location.hash='courses';else render(true);return}
  if(a==='set'){const k=b.dataset.k;c[k]=(k==='limit')?+v:v;save();render(true);return}
  if(a==='play'){c.play=c.play.includes(v)?c.play.filter(x=>x!==v):[...c.play,v];save();render(true);return}
  if(a==='toggle'){c[b.dataset.k]=!c[b.dataset.k];save();render(true);return}
  if(a==='open'){const i=+b.dataset.i;S.open=S.open===i?-1:i;render(true);return}
  if(a==='swap'){const id=route().slice(2);(S.picks[id]=S.picks[id]||{})[b.dataset.slot]=v;render(true);toast(`${PL[v].name}(으)로 바꿨어요`);return}
  if(a==='stk'){toast(b.dataset.how);return}
  if(a==='qr'){S.sheet={kind:'qr',id:b.dataset.id};paintLayer();return}
  if(a==='qr-ok'){S.visits[b.dataset.id]=today();save();S.sheet=null;render(true);toast('방문을 인증했어요');return}
  if(a==='oslot'){S.oslots=S.oslots.includes(v)?S.oslots.filter(x=>x!==v):[...S.oslots,v];render(true);return}
  if(a==='stop'){goStop(+b.dataset.i);return}
  if(a==='wheel'){const R=ranked(),ids=[...R.fit,...R.near].slice(0,8).map(r=>r.c.id);S.sheet={kind:'wheel',ids,on:ids.slice(),rot:0,res:null};paintLayer();return}
  if(a==='wtog'){const w=S.sheet;if(!w||w.spin)return;w.on=w.on.includes(v)?w.on.filter(x=>x!==v):w.ids.filter(x=>x===v||w.on.includes(x));w.res=null;paintLayer();return}
  if(a==='wspin'){spinWheel();return}
  if(a==='wgo'){S.sheet=null;paintLayer();location.hash='c-'+v;return}
  if(a==='me'){findMe();return}
  if(a==='fit'){mapFit();return}
  if(a==='nmap'){openNaver(+b.dataset.i);return}
  if(a==='go'){
    const id=b.dataset.id,cs=D.courses.find(x=>x.id===id),r=resolve(cs,c,S.picks[id]);
    S.diary.push({id:'e'+Date.now(),courseId:id,city:cs.city,type:cs.type,title:cs.title,stops:r.stops.map(s=>s.id),date:c.date,status:'plan',memo:'',photo:null});
    save();render(true);toast(`${dlabel(c.date)} 데이트로 담았어요`);return}
  if(a==='done'){
    const en=S.diary.find(x=>x.id===b.dataset.id);const before=stickerList(en.city).filter(s=>s.on).map(s=>s.key);
    en.status='done';save();
    const got=stickerList(en.city).filter(s=>s.on&&!before.includes(s.key));
    clearTimeout(toastT);S.toast=null;S.sheet={kind:'party',list:got,title:`${dlabel(en.date)} · ${en.title}`};render(true);return}
  if(a==='del'){const id=b.dataset.id;if(S.confirm!==id){S.confirm=id;render(true);return}S.diary=S.diary.filter(x=>x.id!==id);S.confirm=null;save();render(true);toast('지웠어요');return}
  if(a==='share'){
    const id=b.dataset.id,cs=D.courses.find(x=>x.id===id),r=resolve(cs,c,S.picks[id]);
    const text=`${cs.title}\n${dlabel(c.date)} · ${cs.city} ${cs.zone}\n\n`+r.stops.map(s=>`${hm(s.t)} ${s.p.name}${s.p.kakao?'\n'+s.p.kakao:''}`).join('\n')+`\n\n시간은 어림값이에요. 영업시간은 가기 전에 확인해 주세요.`;
    const show=copied=>{S.sheet={kind:'share',text,copied};paintLayer();if(!copied){const t=document.getElementById('share-text');t&&t.select()}};
    try{navigator.clipboard.writeText(text).then(()=>show(true),()=>show(false))}catch(err){show(false)}
    return}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='date-input'&&t.value){S.cond.date=t.value<today()?today():t.value;save();render(true);return}
  if(t.dataset.photo&&t.files&&t.files[0]){
    const en=S.diary.find(x=>x.id===t.dataset.photo),fr=new FileReader();
    fr.onload=()=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,720/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);en.photo=cv.toDataURL('image/jpeg',.72);
      const ok=save();render(true);toast(ok?'사진을 넣었어요':'사진은 보이지만, 브라우저 저장 공간이 부족해 다음에 열면 사라질 수 있어요');
    };img.onerror=()=>toast('이 사진은 열 수 없어요. 다른 사진으로 해 보세요');img.src=fr.result};
    fr.readAsDataURL(t.files[0]);
  }
});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.memo){const en=S.diary.find(x=>x.id===t.dataset.memo);if(en){en.memo=t.value;save()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;paintLayer()}});
render();
</script>
